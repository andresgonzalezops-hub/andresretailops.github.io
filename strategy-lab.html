<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategy Lab | Retail Ops (Luis Andrés)</title>
  <meta name="description" content="Simulador simple de KPIs retail: metas, proyección, estrategia recomendada y comisión estimada." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0f14;
      --card:#141a24;
      --text:#e6edf3;
      --muted:#9aa4b2;
      --brand:#00b4ff;
      --brand2:#00d1b2;
      --radius:20px;
      --shadow:0 14px 36px rgba(0,0,0,.38);
      --stroke:#223043;
      --good:#25d366;
      --warn:#fbbf24;
      --bad:#fb7185;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#0b0f14,#0d1219 60%,#0b0f14);
      line-height:1.65;
    }

    a{color:var(--brand);text-decoration:none}
    img{max-width:100%;display:block}
    .container{max-width:1100px;margin:0 auto;padding:0 20px}

    header{
      position:sticky;top:0;z-index:20;
      background:#0d1219;
      box-shadow:0 4px 14px rgba(0,0,0,.4);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .nav{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 0;flex-wrap:wrap;gap:12px;
    }

    .logo{
      font-weight:900;color:#fff;letter-spacing:.02em;
      display:flex;align-items:center;gap:10px;
    }

    .tag{
      font-size:12px;color:#0b1220;font-weight:900;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      padding:6px 10px;border-radius:999px;
    }

    .tabs{
      display:flex;gap:10px;flex-wrap:wrap;
      align-items:center;justify-content:flex-end;
    }

    .tab{
      border:1px solid #2b3a4f;
      background:#0e141f;
      color:#d6e9ff;
      padding:10px 14px;border-radius:12px;
      font-weight:800;cursor:pointer;transition:.18s;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
    }

    .tab:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(0,180,255,.18)}

    .tab.active{
      border:none;color:#051018;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
    }

    /* ===== NUEVO BOTÓN CREATED BY ===== */
    .creator-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 14px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#051018;
      font-weight:900;
      border:none;
      cursor:pointer;
      transition:.2s;
    }

    .creator-badge:hover{
      transform:translateY(-1px);
      box-shadow:0 6px 22px rgba(0,180,255,.25);
    }

    .creator-badge img{
      width:28px;
      height:28px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid #051018;
    }

    /* ===== RESTO DE TU CSS ORIGINAL (SIN CAMBIOS) ===== */
