<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrés González | Liderazgo Comercial, Retail Ops & Estrategia B2B</title>
  
  <!-- META -->
  <meta name="description" content="Portafolio profesional de Andrés González: Dirección comercial, retail operations, negociación high-ticket, desarrollo de cuentas B2B e institucionales y liderazgo de equipos.">
  <meta property="og:image" content="assets/profile.jpg" />

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-surface: #0e131f;
      --bg-surface-elevated: #141c2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(0, 210, 255, 0.35);
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --accent-cyan: #00d2ff;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --grad-accent: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      --grad-dark: radial-gradient(circle at 50% 0%, #162035 0%, #07090e 70%);

      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      
      --shadow-subtle: 0 10px 30px -10px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 50px -10px rgba(0, 210, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      background-image: var(--grad-dark);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 16px;
      z-index: 100;
      margin-bottom: 40px;
    }

    .nav-inner {
      background: rgba(14, 19, 31, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-subtle);
    }

    .brand {
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #fff; }

    /* BOTONES */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .btn-primary {
      background: var(--grad-accent);
      color: #040914;
      box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 30px rgba(0, 210, 255, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.2);
    }

    .btn-linkedin {
      background: linear-gradient(135deg, #0077b5 0%, #004182 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(0, 119, 181, 0.35);
    }

    .btn-linkedin:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 119, 181, 0.55);
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 40px;
      align-items: center;
      padding: 24px 0 60px;
    }

    .hero-avatar-frame {
      position: relative;
    }

    .hero-avatar {
      width: 175px;
      height: 175px;
      border-radius: var(--radius-lg);
      object-fit: cover;
      border: 2px solid var(--border-accent);
      box-shadow: var(--shadow-glow);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 999px;
      color: var(--accent-cyan);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .hero-title span {
      background: var(--grad-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 720px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* BENTO STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 60px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px 16px;
      text-align: center;
      transition: all 0.2s;
    }

    .stat-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    .stat-num {
      font-size: 2.1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .stat-num.accent { color: var(--accent-cyan); }
    .stat-num.gold { color: var(--accent-gold); }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }

    /* SECTION TITLES */
    .section-head {
      margin-bottom: 30px;
    }

    .section-eyebrow {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* EXPERIENCIA TIMELINE CARDS */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 60px;
    }

    .card-exp {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card-exp:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .exp-role {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    .exp-company {
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 0.98rem;
    }

    .exp-period {
      font-size: 0.82rem;
      color: var(--text-dim);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .exp-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exp-bullets li {
      position: relative;
      padding-left: 20px;
      font-size: 0.93rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .exp-bullets li::before {
      content: "•";
      color: var(--accent-cyan);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    .exp-bullets li strong {
      color: var(--text-main);
    }

    /* STRATEGY LAB BANNER */
    .lab-banner {
      background: linear-gradient(135deg, #0e1726 0%, #112240 100%);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: var(--radius-lg);
      padding: 40px;
      margin-bottom: 60px;
      box-shadow: var(--shadow-glow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 30px;
      align-items: center;
    }

    .lab-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .lab-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 600px;
      margin-bottom: 16px;
    }

    .lab-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lab-pill {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 999px;
      color: #cbd5e1;
      font-weight: 600;
    }

    /* CERTS GRID */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 60px;
    }

    .cert-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cert-box:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
    }

    .cert-thumb {
      width: 100%;
      height: 145px;
      object-fit: cover;
      background: #05080e;
    }

    .cert-info {
      padding: 14px;
    }

    .cert-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .cert-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* CONTACT CARD PREMIUM */
    .contact-card {
      background: radial-gradient(circle at 50% 0%, #152238 0%, #080d16 100%);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: var(--radius-lg);
      padding: 56px 40px;
      text-align: center;
      margin-bottom: 60px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 60px -15px rgba(0, 210, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 40px;
    }

    .contact-card-item {
      background: rgba(14, 21, 35, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 36px 24px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
    }

    .contact-card-item.whatsapp-card:hover {
      border-color: #25D366;
      background: linear-gradient(180deg, rgba(37, 211, 102, 0.12) 0%, rgba(14, 21, 35, 0.9) 100%);
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px -10px rgba(37, 211, 102, 0.35);
    }

    .contact-card-item.email-card:hover {
      border-color: #00d2ff;
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.12) 0%, rgba(14, 21, 35, 0.9) 100%);
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px -10px rgba(0, 210, 255, 0.35);
    }

    .contact-card-item.linkedin-card:hover {
      border-color: #0077B5;
      background: linear-gradient(180deg, rgba(0, 119, 181, 0.15) 0%, rgba(14, 21, 35, 0.9) 100%);
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px -10px rgba(0, 119, 181, 0.4);
    }

    .contact-icon-frame {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .whatsapp-icon-bg {
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: #25D366;
    }

    .email-icon-bg {
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: #00d2ff;
    }

    .linkedin-icon-bg {
      background: rgba(0, 119, 181, 0.15);
      border: 1px solid rgba(0, 119, 181, 0.35);
      color: #0077B5;
    }

    .contact-card-item:hover .contact-icon-frame {
      transform: scale(1.12);
    }

    .contact-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-green {
      color: #25D366;
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.25);
    }

    .badge-cyan {
      color: #00d2ff;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.25);
    }

    .badge-blue {
      color: #38bdf8;
      background: rgba(0, 119, 181, 0.15);
      border: 1px solid rgba(0, 119, 181, 0.3);
